<!DOCTYPE html>
<!-- Source for assets/logo.png, the GitHub organisation avatar.
     GitHub has no REST API for org avatars: upload it in the web UI. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0B; width: 1024px; height: 1024px; overflow: hidden; }
  .avatar { width: 1024px; height: 1024px; background: #0A0A0B; display: grid; place-items: center; }
  .grid { display: grid; grid-template-columns: repeat(3, 208px); gap: 40px; }
  .grid i { display: block; width: 208px; height: 208px; }
</style>
</head>
<body>
<div class="avatar">
  <div class="grid">
    <i style="background:#EDEBE6"></i><i style="background:#EDEBE6"></i><i style="background:#3A3A3F"></i>
    <i style="background:#EDEBE6"></i><i style="background:#4C6FFF"></i><i style="background:#EDEBE6"></i>
    <i style="background:#3A3A3F"></i><i style="background:#EDEBE6"></i><i style="background:#EDEBE6"></i>
  </div>
</div>
</body>
</html>
